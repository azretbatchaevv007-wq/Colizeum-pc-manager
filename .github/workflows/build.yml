name: Build COLIZEUM PC Manager EXE

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest

    steps:
      - name: Download repository
        uses: actions/checkout@v4

      - name: Install Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install PyInstaller
        run: python -m pip install --upgrade pip pyinstaller

      - name: Build EXE
        working-directory: COLIZEUM_PC_Manager_v1_4_INTEGRATED_AUTOMATION
        run: pyinstaller --noconfirm --clean --onefile --windowed --name "COLIZEUM PC Manager" main.py

      - name: Prepare release
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force release
          Copy-Item "COLIZEUM_PC_Manager_v1_4_INTEGRATED_AUTOMATION\dist\COLIZEUM PC Manager.exe" "release\COLIZEUM PC Manager.exe"
          Copy-Item "COLIZEUM_PC_Manager_v1_4_INTEGRATED_AUTOMATION\config.json" "release\config.json"

      - name: Upload Windows build
        uses: actions/upload-artifact@v4
        with:
          name: COLIZEUM-PC-Manager-Windows
          path: release/*
